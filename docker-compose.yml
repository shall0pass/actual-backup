services:
  actual-backup:
    build:
      context: .
      dockerfile: dockerfile
    container_name: actual-backup
    ports:
      - "3000:3000"
    environment:
      - TZ=America/Chicago
      - DEBUG=${DEBUG:-false}
      - WEB_PORT=3000
      - BACKUP_DATA_ROOT=/app/data
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
      - SESSION_SECRET=${SESSION_SECRET:-actual-backup-dev-session}
      - ADMIN_USER_ID=admin
      - ADMIN_USERNAME_FILE=/run/secrets/admin_username
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
    volumes:
      - ./local_dir:/app/data
    secrets:
      - admin_username
      - admin_password
secrets:
  admin_username:
    file: ./secrets/admin_username.txt
  admin_password:
    file: ./secrets/admin_password.txt